# Build + push the image to public GHCR on a version tag.
#
# The image is published to a public registry — ghcr.io/fairtier/rill-deploy-shim
# — pinned to an immutable semver tag (no :latest). GitHub Actions
# authenticates to GHCR natively with GITHUB_TOKEN; no extra PAT is needed.
#
# Release: push a tag `v<semver>` (e.g. v0.1.0). This builds and pushes
# ghcr.io/fairtier/rill-deploy-shim:<semver>. Then update the pinned image
# tag wherever this image is deployed.
#
# First publish creates a private package under the org; make it PUBLIC once
# in the package settings (Packages → rill-deploy-shim → Package settings →
# Change visibility → Public), otherwise pulls fail with 401.
name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version from go.mod rather than repeating it here — one
          # hand-maintained copy (the Dockerfile ARG) is enough.
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned rather than floating on latest: the config enables the
          # gofumpt formatter, and a linter bump can add formatting rules that
          # turn an unrelated push red. It is also a hard floor — golangci-lint
          # refuses to run when the Go it was built with is below the module's
          # `go` directive, so a 1.27 go.mod needs a 1.27-built linter.
          version: v2.13.2
      # Enforce the // @ts-check JSDoc types in deployshim.js (editors check
      # them via the TS language server, but only CI makes them binding).
      - name: Typecheck deployshim.js
        run: npx -y -p typescript tsc --noEmit --allowJs --checkJs --strict --target es2022 --lib es2022,dom deployshim.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Immutable semver tag only — no :latest (box images are pinned).
          tags: ghcr.io/fairtier/rill-deploy-shim:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
