# Build + push the image to public GHCR on a version tag.
#
# The image is published to a public registry — ghcr.io/fairtier/rill-deploy-shim
# — pinned to an immutable semver tag (no :latest). GitHub Actions
# authenticates to GHCR natively with GITHUB_TOKEN; no extra PAT is needed.
#
# Release: push a tag `v<semver>` (e.g. v0.1.0). This builds and pushes
# ghcr.io/fairtier/rill-deploy-shim:<semver>. Then update the pinned image
# tag wherever this image is deployed.
#
# First publish creates a private package under the org; make it PUBLIC once
# in the package settings (Packages → rill-deploy-shim → Package settings →
# Change visibility → Public), otherwise pulls fail with 401.
name: build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match go.mod.
          go-version: "1.26"
      - run: go build ./...
      - run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      # Enforce the // @ts-check JSDoc types in deployshim.js (editors check
      # them via the TS language server, but only CI makes them binding).
      - name: Typecheck deployshim.js
        run: npx -y -p typescript tsc --noEmit --allowJs --checkJs --strict --target es2022 --lib es2022,dom deployshim.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        # v0.1.0 -> 0.1.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Immutable semver tag only — no :latest (box images are pinned).
          tags: ghcr.io/fairtier/rill-deploy-shim:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
